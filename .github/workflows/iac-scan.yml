name: project-checks

on:
  workflow_call:
  push:
    branches: [main]
    paths: ["infra/**", "app/**", "pokemon-monitor/**", "adversary/**", "detection/**", "scripts/**", "requirements-dev.*", ".github/workflows/**"]
  pull_request:
    paths: ["infra/**", "app/**", "pokemon-monitor/**", "adversary/**", "detection/**", "scripts/**", "requirements-dev.*", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pytest -q
        working-directory: app
      - run: python -m pytest -q
        working-directory: pokemon-monitor
      - run: python -m pytest -q scripts/tests adversary/tests detection/tests

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.7
      - run: terraform fmt -check -recursive infra/
      - name: Terraform validate without cloud credentials
        shell: bash
        run: |
          for root in infra/bootstrap infra/envs/dev infra/envs/lab; do
            terraform -chdir="$root" init -backend=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
      - name: Checkov
        uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0 # v12
        with:
          directory: infra/
          framework: terraform
          output_format: cli
          output_file_path: console
          soft_fail: false
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: config
          scan-ref: infra/
          exit-code: "1"
          severity: HIGH,CRITICAL
          format: table
