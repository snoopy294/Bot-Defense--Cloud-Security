name: iac-security-scan

# Static security scanning of Terraform on every push/PR. No cloud access needed
# (read-only analysis), so this runs without any AWS credentials.
on:
  push:
    branches: [main]
    paths: ["infra/**"]
  pull_request:
    paths: ["infra/**"]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform fmt check
        uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/

      # Checkov — policy-as-code misconfiguration scanner.
      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          framework: terraform
          output_format: cli
          output_file_path: console
          soft_fail: false # fail the build on a HIGH/CRITICAL finding

      # Trivy config scan (this is the maintained successor to tfsec).
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra/
          exit-code: "1"
          severity: HIGH,CRITICAL
          format: table
