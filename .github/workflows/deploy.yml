name: deploy-dev

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the full dev stack (billable WAF and analytics); false only plans"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/iac-scan.yml

  terraform:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_github_repo: ${{ github.repository }}
      TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
      TF_VAR_state_kms_key_arn: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in TF_STATE_BUCKET TF_STATE_LOCK_TABLE TF_VAR_budget_alert_email TF_VAR_state_kms_key_arn; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository variable for $name (see infra/README.md)"
              exit 1
            fi
          done
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.7
      - name: Terraform init
        shell: bash
        run: |
          terraform init -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=envs/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE" \
            -backend-config="encrypt=true"
      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan
      # Full-stack deployment is explicit; routine pushes never create resources.
      - name: Terraform apply
        if: inputs.apply
        run: terraform apply -input=false tfplan
      - name: Remove local plan
        if: always()
        run: rm -f tfplan
